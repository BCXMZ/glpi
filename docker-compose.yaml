services:
  app:
    container_name: "bcxdev/glpi:latest"
    build:
      context: ".docker/app"
      args:
        PHP_VERSION: "8.4"
    restart: "unless-stopped"
    volumes:
      - ".:/var/www/glpi:rw"
      - "custom_php_ini:/usr/local/etc/php/custom_conf.d/:rw"
    ports:
       -"8080:80"     
     
    extra_hosts:
       -"host.docker.internal:host-gateway"     
      
    # To create a preconfigured LDAP object in GLPI, run `make console c='tools:generate_dev_lda
volumes:
 glpi_conf:
 glpi_files:
 glpi_pluggins:
 
 

