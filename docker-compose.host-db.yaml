services:
  glpi:
    image: ${GLPI_IMAGE:?Set GLPI_IMAGE to your published Docker Hub image}
    restart: unless-stopped
    ports:
      - "${GLPI_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - glpi_config:/var/www/glpi/config
      - glpi_files:/var/www/glpi/files
      - glpi_marketplace:/var/www/glpi/marketplace
      - glpi_plugins:/var/www/glpi/plugins

volumes:
  glpi_config:
  glpi_files:
  glpi_marketplace:
  glpi_plugins:
